<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Recommendations</title>
    <style>
        /* Base styles */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Login screen styles */
        #login-container { background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; margin-top: 10vh; }
        #login-container h2 { margin-top: 0; margin-bottom: 25px; color: #bb86fc; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #333; background-color: #2c2c2c; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #bb86fc; }
        button { background-color: #bb86fc; color: #121212; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; transition: background-color 0.3s; }
        button:hover { background-color: #9965f4; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #error-message { color: #cf6679; margin-top: 15px; display: none; }

        /* Movie dashboard styles */
        #app-container { display: none; width: 100%; max-width: 1200px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; }
        
        /* Header buttons group */
        .header-buttons { display: flex; gap: 15px; }
        .header-btn { background-color: transparent; color: #fff; border: 1px solid #fff; width: auto; padding: 8px 15px; }
        .header-btn:hover { background-color: rgba(255,255,255,0.1); }
        .toggle-btn { border-color: #bb86fc; color: #bb86fc; }
        .toggle-btn:hover { background-color: rgba(187, 134, 252, 0.1); }
        
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .movie-card { background-color: #1e1e1e; border-radius: 10px; overflow: hidden; transition: transform 0.3s; display: flex; flex-direction: column; position: relative; }
        .movie-card:hover { transform: translateY(-10px); }
        .poster { width: 100%; height: 300px; background-color: #2c2c2c; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #555; background-size: cover; background-position: center; }
        .movie-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .movie-title { font-size: 16px; font-weight: bold; margin: 0 0 10px 0; }
        .movie-genre { font-size: 12px; color: #aaa; margin: 0; }
        
        /* Prediction score badge */
        .score-badge { position: absolute; top: 10px; right: 10px; background-color: rgba(187, 134, 252, 0.9); color: #121212; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10; }
        
        #loading { display: none; text-align: center; margin-top: 50px; font-size: 20px; color: #bb86fc; }
    </style>
</head>
<body>

    <div id="login-container">
        <h2>Sign In</h2>
        <input type="email" id="email-input" placeholder="Email" required>
        <input type="password" id="password-input" placeholder="Password" required>
        <button onclick="handleLogin()">Sign In</button>
        <p id="error-message">Invalid email or password!</p>
    </div>

    <div id="app-container">
        <div class="header">
            <h1 id="welcome-message">Top picks for you</h1>
            <div class="header-buttons">
                <button class="header-btn toggle-btn" onclick="toggleScores()" id="toggle-scores-btn" style="display: none;">Show AI Scores</button>
                <button class="header-btn" onclick="signOut()">Sign Out</button>
            </div>
        </div>
        
        <div id="loading">Generating AI recommendations... 🎬</div>
        
        <div class="movies-grid" id="movies-container">
            </div>
    </div>

    <script>
        const OMDB_API_KEY = 'OMDB_API_KEY'; 
        const API_BASE_URL = 'http://127.0.0.1:8000';
        
        // Global state to track if scores are visible
        let isScoresVisible = false; 

        // 1. Handle user authentication
        async function handleLogin() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-message');
            const loginBtn = document.querySelector('#login-container button');
            
            errorMsg.style.display = 'none';
            loginBtn.textContent = 'Loading...';
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (!response.ok) throw new Error('Login failed');

                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('login-container').style.display = 'none';
                    document.getElementById('app-container').style.display = 'block';
                    document.getElementById('welcome-message').innerText = `Top picks for User #${data.userId}`;
                    
                    // Reset scores visibility on new login
                    isScoresVisible = false; 
                    document.getElementById('toggle-scores-btn').innerText = 'Show AI Scores';
                    
                    fetchRecommendations(data.userId);
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.textContent = 'Sign In';
                loginBtn.disabled = false;
            }
        }

        // 2. Fetch predictions from FastAPI
        async function fetchRecommendations(userId) {
            const moviesContainer = document.getElementById('movies-container');
            const loading = document.getElementById('loading');
            const toggleBtn = document.getElementById('toggle-scores-btn');
            
            moviesContainer.innerHTML = '';
            toggleBtn.style.display = 'none'; // Hide button while loading
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE_URL}/recommend/${userId}`);
                const movies = await response.json();
                await displayMovies(movies);
                
                // Show the toggle button after movies load
                toggleBtn.style.display = 'block'; 
            } catch (error) {
                console.error('Error fetching movies:', error);
                moviesContainer.innerHTML = '<p style="color:red;">Failed to connect to the server.</p>';
            } finally {
                loading.style.display = 'none';
            }
        }

        // 3. Render movie cards simultaneously using Promise.all
        async function displayMovies(movies) {
            const container = document.getElementById('movies-container');
            
            const moviePromises = movies.map(async (movie) => {
                const paddedId = String(movie.imdbId).padStart(7, '0');
                const fullImdbId = `tt${paddedId}`;
                let posterUrl = '';
                
                if (OMDB_API_KEY) {
                    try {
                        const url = `https://www.omdbapi.com/?i=${fullImdbId}&apikey=${OMDB_API_KEY}`;
                        const omdbRes = await fetch(url);
                        const omdbData = await omdbRes.json();
                        
                        if (omdbData.Poster && omdbData.Poster !== 'N/A') {
                            posterUrl = omdbData.Poster;
                        }
                    } catch (e) {
                        console.error('OMDb API error:', e);
                    }
                }

                const posterHtml = posterUrl 
                    ? `<div class="poster" style="background-image: url('${posterUrl}')"></div>` 
                    : `<div class="poster">🎬</div>`;

                // Convert probability (e.g. 0.9523) to percentage (95.2%)
                const percentageScore = (movie.score * 100).toFixed(1);

                return `
                    <div class="movie-card">
                        <div class="score-badge">Match: ${percentageScore}%</div>
                        
                        ${posterHtml}
                        <div class="movie-info">
                            <p class="movie-title">${movie.title}</p>
                            <p class="movie-genre">${movie.genre}</p>
                        </div>
                    </div>
                `;
            });

            const movieCardsHtmlArray = await Promise.all(moviePromises);
            container.innerHTML = movieCardsHtmlArray.join('');
            
            // Re-apply visibility state if the user clicks toggle BEFORE images finish loading
            applyScoreVisibility();
        }

        // 4. Toggle functionality for AI scores
        function toggleScores() {
            isScoresVisible = !isScoresVisible;
            const btn = document.getElementById('toggle-scores-btn');
            
            if (isScoresVisible) {
                btn.innerText = 'Hide AI Scores';
            } else {
                btn.innerText = 'Show AI Scores';
            }
            
            applyScoreVisibility();
        }

        // Helper function to apply visibility to all badges
        function applyScoreVisibility() {
            const badges = document.querySelectorAll('.score-badge');
            badges.forEach(badge => {
                badge.style.display = isScoresVisible ? 'block' : 'none';
            });
        }

        // 5. Handle sign out
        function signOut() {
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('movies-container').innerHTML = '';
            document.getElementById('email-input').value = '';
            document.getElementById('password-input').value = '';
            document.getElementById('toggle-scores-btn').style.display = 'none';
        }
    </script>
</body>
</html>
