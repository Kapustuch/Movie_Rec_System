<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Recommender</title>
    <style>
        :root {
            --bg-color: #141414; /* Netflix Dark */
            --card-bg: #2B2B2B;
            --accent: #e50914;   /* Cinematic Red */
            --accent-hover: #f40612;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Login Screen --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            height: 100vh;
        }

        .login-box {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 50px 60px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
        }

        .login-box h1 { margin-top: 0; margin-bottom: 30px; font-size: 24px; }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 4px;
            background-color: #333;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            -moz-appearance: textfield; 
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input:focus { outline: 2px solid var(--accent); }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }

        /* --- Dashboard Screen --- */
        #dashboard-screen {
            display: none;
            padding: 40px 5%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h2 { margin: 0; }

        .header button {
            width: auto;
            padding: 8px 20px;
            background-color: transparent;
            border: 1px solid var(--text-muted);
            font-size: 14px;
        }
        
        .header button:hover { background-color: rgba(255,255,255,0.1); }

        /* --- Movies Carousel --- */
        .movies-carousel {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 0 30px 0;
            scroll-behavior: smooth;
        }

        .movies-carousel::-webkit-scrollbar { height: 8px; }
        .movies-carousel::-webkit-scrollbar-track { background: #141414; border-radius: 4px; }
        .movies-carousel::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .movies-carousel::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            min-width: 250px; 
            max-width: 250px;
            flex: 0 0 auto;   
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        /* --- Poster Placeholder --- */
        .movie-poster-placeholder {
            width: 100%;
            height: 350px; /* Висота постера */
            background: linear-gradient(135deg, #222 0%, #444 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 48px;
            position: relative;
        }
        .movie-poster-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-details { padding: 15px; }
        .movie-title { font-size: 1.1rem; font-weight: bold; margin: 0 0 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-genre { color: var(--text-muted); font-size: 0.85rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #loader { display: none; color: var(--text-muted); margin-top: 15px; font-size: 14px;}
        #error-message { color: var(--accent); margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>AI Recommendations</h1>
            <input type="text" id="user-id-input" placeholder="Enter User ID (e.g. 31139)" required>
            <button onclick="login()">Sign In</button>
            <div id="loader">Connecting to AI Model...</div>
            <div id="error-message">Error connecting to server. Is FastAPI running?</div>
        </div>
    </div>

    <div id="dashboard-screen">
        <div class="header">
            <h2 id="welcome-message">Top Picks for You</h2>
            <button onclick="logout()">Sign Out</button>
        </div>
        <div class="movies-carousel" id="movies-container">
            </div>
    </div>

    <script>

        // OMDB API Key
        const OMDB_API_KEY = 'YOUR_OMDB_API_KEY_HERE'; 
        
        // URL вашого локального FastAPI сервера
        const BACKEND_URL = 'http://127.0.0.1:8000';

        async function login() {
            const userInput = document.getElementById('user-id-input').value;
            const userId = userInput.trim().replace(/\D/g, ''); 
            
            if (!userId) {
                alert("Please enter a numeric User ID!");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';

            try {
                // Send request to FastAPI (backend.py)
                const response = await fetch(`${BACKEND_URL}/recommend/${userId}`);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const recommendations = await response.json();
                document.getElementById('loader').style.display = 'none';

                showDashboard(userId, recommendations);

            } catch (error) {
                console.error("Помилка сервера:", error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('error-message').style.display = 'block';
            }
        }

        function showDashboard(userId, movies) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            document.getElementById('welcome-message').innerText = `Top Picks for User #${userId}`;

            const container = document.getElementById('movies-container');
            container.innerHTML = ''; 

            if (movies.length === 0) {
                container.innerHTML = '<p style="padding: 20px;">No recommendations found for this user.</p>';
                return;
            }

            movies.forEach(movie => {
                const imgElementId = `poster-${movie.imdbId}`;
                const cardHtml = `
                    <div class="movie-card">
                        <div class="movie-poster-placeholder" id="${imgElementId}-container">
                            🎬
                        </div>
                        <div class="movie-details">
                            <h3 class="movie-title" title="${movie.title}">${movie.title}</h3>
                            <p class="movie-genre" title="${movie.genre}">${movie.genre}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;

                // Load poster from OMDb
                fetchPoster(movie.imdbId, imgElementId);
            });
        }

        async function fetchPoster(rawImdbId, elementId) {
            if (!rawImdbId || rawImdbId === "0") return; // Skip if we don't have imdbId

            const formattedId = 'tt' + String(rawImdbId).padStart(7, '0');
            
            try {
                const response = await fetch(`https://www.omdbapi.com/?i=${formattedId}&apikey=${OMDB_API_KEY}`);
                const data = await response.json();

                if (data.Poster && data.Poster !== "N/A") {
                    const container = document.getElementById(`${elementId}-container`);
                    container.innerHTML = `<img src="${data.Poster}" alt="${data.Title}">`;
                    container.style.background = 'transparent'; 
                }
            } catch (error) {
                console.error("Failed to load poster for " + formattedId, error);
            }
        }

        function logout() {
            document.getElementById('user-id-input').value = ''; 
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('movies-container').innerHTML = ''; 
        }
    </script>
</body>
</html>
